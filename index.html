<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kegelabend Planer</title>
<meta name="description" content="Plane deinen nächsten Kegelabend mit Freunden – einfach, offline, mit Spaß.">
<meta name="theme-color" content="#1E3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kegelabend">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<!-- Cloud-Funktionen (Konten, Clubs) laufen über Supabase. Lädt nur, wenn online.
     WICHTIG: kein "defer" hier - das App-Skript weiter unten braucht
     window.supabase bereits beim ersten Ausführen, nicht erst danach. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F3EAD3;
    --surface:#FFFDF6;
    --dark:#1E3B2C;
    --dark-2:#152B1E;
    --accent:#D9A441;
    --accent-dark:#B8842E;
    --alert:#A23E33;
    --ok:#3F6B4A;
    --wood:#5B3A29;
    --text:#2B2118;
    --text-muted:#7a6a56;
    --radius:16px;
    --shadow:0 3px 10px rgba(43,33,24,.14);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wood);
    color:var(--text);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.35);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(217,164,65,.07), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(30,59,44,.05), transparent 40%);
  }
  header.appbar{
    background:var(--dark);
    background-image:linear-gradient(180deg, var(--dark), var(--dark-2));
    color:var(--bg);
    padding:20px 20px 16px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:3px solid var(--accent);
  }
  header.appbar h1{
    margin:0;
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-shadow:2px 2px 0 rgba(217,164,65,.25);
  }
  header.appbar p{
    margin:6px 0 0;
    font-size:.85rem;
    color:rgba(243,234,211,.8);
    font-family:var(--font-mono);
  }
  #banner-storage{
    display:none;
    background:var(--alert);
    color:#fff;
    font-size:.78rem;
    padding:8px 16px;
    text-align:center;
    line-height:1.4;
  }
  main{
    flex:1;
    padding:16px 16px 100px;
    overflow-y:auto;
  }
  .view{display:none;}
  .view.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .view.active{animation:none;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  h2.section-title{
    font-size:.95rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--wood);
    font-weight:800;
    margin:20px 0 10px;
  }
  h2.section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border:1px solid rgba(91,58,41,.1);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
    position:relative;
    cursor:pointer;
  }
  .card:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible{
    outline:3px solid var(--accent-dark);
    outline-offset:2px;
  }
  .card .stamp{
    position:absolute;
    top:-12px;
    right:14px;
    width:46px;height:46px;
    border-radius:50%;
    border:2px dashed var(--dark);
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    font-size:1.2rem;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .card h3{margin:0 0 4px;font-size:1.05rem;font-weight:800;padding-right:40px;}
  .card .meta-row{
    font-family:var(--font-mono);
    font-size:.82rem;
    color:var(--text-muted);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .card.dashed{
    border:2px dashed var(--wood);
    background:transparent;
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--wood);
    font-weight:700;
    min-height:64px;
  }
  .card.past{opacity:.55;}

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--wood);
  }
  .empty-state .emoji{font-size:2.4rem;display:block;margin-bottom:10px;}
  .empty-state p{margin:0 0 16px;line-height:1.5;}

  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:.95rem;
  }
  .btn-primary{background:var(--accent);color:var(--dark);}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-outline{background:transparent;color:var(--dark);border:2px solid var(--dark);}
  .btn-alert{background:transparent;color:var(--alert);border:2px solid var(--alert);}
  .btn-block{width:100%;}

  nav.tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid rgba(91,58,41,.15);
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    padding:10px 4px 12px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:.72rem;
    font-weight:700;
    border-top:3px solid transparent;
  }
  nav.tabbar button .icon{font-size:1.3rem;}
  nav.tabbar button.active{color:var(--dark);border-top-color:var(--accent);}

  .fab{
    position:fixed;
    right:calc(50% - 240px + 20px);
    bottom:76px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--dark);
    font-size:1.6rem;
    font-weight:800;
    line-height:1;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    z-index:11;
  }
  @media (max-width:480px){
    .fab{right:20px;}
  }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--wood);
    background:var(--surface);
    color:var(--text);
    font-size:.85rem;
    font-weight:600;
  }
  .chip.selected{background:var(--accent);border-color:var(--accent-dark);color:var(--dark);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(21,43,30,.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .modal h2{margin:0 0 16px;font-size:1.15rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--dark);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.8rem;font-weight:700;color:var(--wood);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid rgba(91,58,41,.3);
    background:var(--surface);
    font-family:inherit;
    font-size:.95rem;
    color:var(--text);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .two-col{display:flex;gap:10px;}
  .two-col .field{flex:1;}
  .time-select{display:flex;align-items:center;gap:6px;}
  .time-select select{flex:1;font-family:var(--font-mono);text-align:center;}
  .time-select .colon{font-weight:800;color:var(--wood);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal-actions .btn{flex:1;min-width:110px;}
  .modal-close{
    position:absolute;top:14px;right:14px;
    background:rgba(91,58,41,.1);
    width:32px;height:32px;border-radius:50%;
    font-size:1.1rem;color:var(--wood);
  }
  .modal-inner-wrap{position:relative;}

  .friend-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;
    border-bottom:1px solid rgba(91,58,41,.08);
  }
  .friend-row:last-child{border-bottom:none;}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:.85rem;flex-shrink:0;
  }
  .friend-row .fname{flex:1;font-weight:600;}
  .rsvp-group{display:flex;gap:4px;}
  .rsvp-btn{
    width:30px;height:30px;border-radius:8px;
    background:var(--surface);border:1.5px solid rgba(91,58,41,.25);
    font-size:.9rem;opacity:.4;
  }
  .rsvp-btn.active{opacity:1;border-color:transparent;}
  .rsvp-btn.active.ok{background:var(--ok);color:#fff;}
  .rsvp-btn.active.pending{background:var(--accent);color:var(--dark);}
  .rsvp-btn.active.declined{background:var(--alert);color:#fff;}
  .friend-toggle{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--wood);
    background:var(--surface);flex-shrink:0;
  }
  .friend-toggle.on{background:var(--dark);border-color:var(--dark);color:var(--accent);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;}

  .game-pick-list{margin-top:10px;}
  .game-pick-item{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1.5px solid rgba(91,58,41,.15);
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .game-pick-item .gname{flex:1;font-weight:600;font-size:.9rem;}
  .game-pick-item button{
    background:none;color:var(--wood);font-size:1rem;padding:2px 6px;
  }

  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .emoji-pick button{
    width:38px;height:38px;font-size:1.2rem;
    border-radius:10px;border:2px solid rgba(91,58,41,.2);background:var(--surface);
  }
  .emoji-pick button.selected{border-color:var(--accent-dark);background:var(--accent);}

  .toast{
    position:fixed;
    bottom:90px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--dark);color:var(--bg);
    padding:10px 20px;border-radius:999px;
    font-size:.88rem;font-weight:600;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    z-index:200;
    pointer-events:none;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .share-box textarea{
    width:100%;min-height:160px;
    font-family:var(--font-mono);
    font-size:.85rem;
    padding:12px;
    border-radius:10px;
    border:1.5px solid rgba(91,58,41,.3);
    background:var(--surface);
    color:var(--text);
  }

  /* ---------- Cloud / Club styles ---------- */
  .badge{
    display:inline-block;
    font-size:.68rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:3px 8px;
    border-radius:999px;
    background:var(--accent);
    color:var(--dark);
    margin-left:6px;
    vertical-align:middle;
  }
  .badge.outline{background:transparent;border:1.5px solid var(--wood);color:var(--wood);}
  .badge.adminbadge{background:var(--alert);color:#fff;}

  .offline-banner{
    background:rgba(162,62,51,.1);
    border:1.5px solid var(--alert);
    color:var(--alert);
    border-radius:12px;
    padding:10px 14px;
    font-size:.82rem;
    margin-bottom:14px;
    line-height:1.4;
  }
  .offline-banner.syncing{
    background:rgba(217,164,65,.12);
    border-color:var(--accent-dark);
    color:var(--wood);
  }
  .setup-notice{
    background:var(--surface);
    border:2px dashed var(--wood);
    border-radius:var(--radius);
    padding:18px;
    font-size:.88rem;
    line-height:1.5;
    color:var(--text);
  }
  .setup-notice code{
    background:rgba(91,58,41,.1);
    padding:1px 5px;
    border-radius:5px;
    font-family:var(--font-mono);
    font-size:.82rem;
  }

  .segmented{
    display:flex;
    background:rgba(91,58,41,.08);
    border-radius:12px;
    padding:4px;
    margin-bottom:16px;
    gap:4px;
  }
  .segmented button{
    flex:1;
    background:none;
    padding:8px 4px;
    border-radius:9px;
    font-size:.82rem;
    font-weight:700;
    color:var(--wood);
  }
  .segmented button.active{background:var(--surface);color:var(--dark);box-shadow:var(--shadow);}

  .club-switcher{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .club-switcher select{
    flex:1;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid rgba(91,58,41,.3);
    background:var(--surface);
    font-family:inherit;
    font-size:.9rem;
    color:var(--text);
  }

  .star-rating{display:inline-flex;gap:2px;}
  .star-rating button{
    background:none;font-size:1.2rem;line-height:1;
    color:rgba(91,58,41,.25);padding:2px;
  }
  .star-rating button.filled{color:var(--accent-dark);}

  .official-tag{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
  }

  .link-btn{
    background:none;color:var(--dark);font-weight:700;
    text-decoration:underline;font-size:.85rem;padding:4px 0;
  }

  .auth-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .auth-tabs button{
    flex:1;padding:9px;border-radius:10px;
    border:2px solid var(--dark);background:transparent;color:var(--dark);font-weight:700;
  }
  .auth-tabs button.active{background:var(--dark);color:var(--bg);}

  .rsvp-readonly{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.88rem;}
  .rsvp-readonly .rstatus{font-size:1rem;}

  /* ---------- Königsspiel / Ergebnisse ---------- */
  .crown-btn{
    background:none;font-size:1.1rem;padding:2px 4px;
    opacity:.3;filter:grayscale(1);
  }
  .crown-btn.active{opacity:1;filter:none;}
  .result-block{
    background:var(--surface);
    border:1.5px solid rgba(91,58,41,.15);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
  }
  .result-block.is-koenig{border-color:var(--accent-dark);background:linear-gradient(180deg, rgba(217,164,65,.1), var(--surface));}
  .result-block h4{margin:0 0 8px;font-size:.92rem;display:flex;align-items:center;gap:6px;}
  .rank-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .rank-item{
    display:flex;align-items:center;gap:8px;
    background:var(--bg);border:1.5px solid rgba(91,58,41,.2);
    border-radius:9px;padding:6px 10px;font-size:.88rem;
  }
  .rank-item .rank-num{
    font-family:var(--font-mono);font-weight:800;color:var(--accent-dark);
    width:20px;flex-shrink:0;
  }
  .rank-item .rname{flex:1;}
  .rank-item button{background:none;color:var(--text-muted);font-size:.9rem;}
  .pool-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .winner-chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 12px;border-radius:999px;
    border:2px solid var(--wood);background:var(--surface);
    font-size:.85rem;font-weight:600;
  }
  .winner-chip.selected{background:var(--accent);border-color:var(--accent-dark);color:var(--dark);}
  .hof-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 0;border-bottom:1px solid rgba(91,58,41,.08);
  }
  .hof-item:last-child{border-bottom:none;}
  .hof-rank{font-family:var(--font-mono);font-weight:800;width:28px;font-size:1.05rem;color:var(--wood);}
  .hof-count{margin-left:auto;font-family:var(--font-mono);font-weight:700;color:var(--accent-dark);font-size:.9rem;}

  /* ---------- Spiele-Tags ---------- */
  .tag-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .tag-badge{
    display:inline-flex;align-items:center;gap:3px;
    font-size:.72rem;font-weight:700;
    padding:2px 8px;border-radius:999px;
    background:rgba(91,58,41,.08);color:var(--wood);
  }
  .tag-filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag-filter-row .chip{padding:6px 12px;font-size:.8rem;}
</style>
</head>
<body>
<div id="app">
  <div id="banner-storage"></div>
  <header class="appbar">
    <h1>🎳 Kegelabend</h1>
    <p id="subtitle">Lade...</p>
  </header>

  <main>
    <section id="view-games" class="view"></section>
    <section id="view-club" class="view active"></section>
    <section id="view-admin" class="view"></section>
  </main>

  <button class="fab" id="fab" aria-label="Neu anlegen">+</button>

  <nav class="tabbar" id="tabbar">
    <button data-tab="club" class="active"><span class="icon">🏛️</span>Club</button>
    <button data-tab="games"><span class="icon">📋</span>Spiele</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Storage layer ---------- */
const K = { games:'kegel_games_v1' };
let memoryStore = {};
function testStorage(){
  try{ const t='__t__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
const storageAvailable = testStorage();

function loadData(key, fallback){
  try{
    if(storageAvailable){
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }
    return (key in memoryStore) ? memoryStore[key] : fallback;
  }catch(e){ return fallback; }
}
function saveData(key, value){
  try{
    if(storageAvailable){ localStorage.setItem(key, JSON.stringify(value)); }
    else { memoryStore[key] = value; }
  }catch(e){ /* ignore write errors */ }
}

if(!storageAvailable){
  const b = document.getElementById('banner-storage');
  b.style.display = 'block';
  b.textContent = '⚠️ In dieser Vorschau wird nicht dauerhaft gespeichert. Öffne die heruntergeladene Datei direkt in deinem Browser – dort funktioniert die Offline-Speicherung vollständig.';
}

/* ---------- Helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function esc(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDateHuman(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
}
/* Eigene Zeitauswahl (Stunde/Minute per <select>) statt native type="time"-
   Eingabe: manche Handy-Browser rendern den nativen Zeit-Picker fehlerhaft
   (Bedienelemente ragen aus dem Popup heraus). Mit eigenen Dropdowns haben
   wir volle Kontrolle über die Darstellung, unabhängig vom Gerät. */
function timeSelectHtml(id, value){
  const parts = (value || '20:00').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  const nearestQuarter = [0,15,30,45].reduce((a,b) => Math.abs(b-m) < Math.abs(a-m) ? b : a, 0);
  const hourOpts = Array.from({length:24}, (_,i) => '<option value="'+i+'" '+(i===h?'selected':'')+'>'+String(i).padStart(2,'0')+'</option>').join('');
  const minOpts = [0,15,30,45].map(mm => '<option value="'+mm+'" '+(mm===nearestQuarter?'selected':'')+'>'+String(mm).padStart(2,'0')+'</option>').join('');
  return '<div class="time-select">'
    + '<select id="'+id+'-h">'+hourOpts+'</select>'
    + '<span class="colon">:</span>'
    + '<select id="'+id+'-m">'+minOpts+'</select>'
  + '</div>';
}
function readTimeSelect(id){
  const h = document.getElementById(id+'-h');
  const m = document.getElementById(id+'-m');
  if(!h || !m) return '20:00';
  return String(h.value).padStart(2,'0') + ':' + String(m.value).padStart(2,'0');
}
function nameToColor(name){
  const palette = ['#1E3B2C','#5B3A29','#A23E33','#B8842E','#3F6B4A','#8a5a3b'];
  let h = 0;
  for(let i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
  return palette[Math.abs(h) % palette.length];
}

function genInviteCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
async function createClub(name){
  let lastErr = null;
  for(let attempt=0; attempt<5; attempt++){
    const code = genInviteCode();
    const { data, error } = await sb.from('clubs')
      .insert({ name, invite_code: code, owner_id: cloud.session.user.id })
      .select().single();
    if(!error){
      await sb.from('club_members').insert({ club_id: data.id, user_id: cloud.session.user.id, role: 'owner' });
      await loadMyClubs();
      cloud.activeClubId = data.id;
      saveData('kegel_active_club', data.id);
      return data;
    }
    lastErr = error;
    if(error.code !== '23505') break; // nur bei Code-Kollision erneut versuchen
  }
  throw lastErr;
}

/* =========================================================
   OFFLINE-WARTESCHLANGE
   =========================================================
   Ergebnisse, Bewertungen und Zusagen sind die Dinge, die man
   typischerweise VOR ORT auf der Kegelbahn einträgt - oft mit
   schlechtem Empfang im Keller. Statt bei fehlendem Netz einfach
   zu scheitern, wird die Änderung hier lokal zwischengespeichert
   und automatisch übertragen, sobald wieder eine Verbindung da ist. */
const OFFLINE_QUEUE_KEY = 'kegel_offline_queue_v1';
function loadOfflineQueue(){ return loadData(OFFLINE_QUEUE_KEY, []); }
function saveOfflineQueue(q){ saveData(OFFLINE_QUEUE_KEY, q); }
function queueOfflineWrite(op){
  const q = loadOfflineQueue();
  q.push(op);
  saveOfflineQueue(q);
}
function pendingOfflineCount(){ return loadOfflineQueue().length; }

async function flushOfflineQueue(){
  if(!cloudEnabled || !sb) return;
  let q = loadOfflineQueue();
  if(q.length === 0) return;
  const remaining = [];
  let anySucceeded = false;
  for(const op of q){
    try{
      if(op.type === 'results_sync'){
        await sb.from('club_event_results').delete().eq('event_id', op.eventId).eq('game_id', op.gameId);
        if(op.userIds.length){
          const rows = op.userIds.map((uid,i) => ({
            event_id: op.eventId, club_id: op.clubId, game_id: op.gameId,
            user_id: uid, platz: i+1, updated_by: op.updatedBy
          }));
          const { error } = await sb.from('club_event_results').insert(rows);
          if(error) throw error;
        }
      } else if(op.type === 'rsvp_upsert'){
        const { error } = await sb.from('club_event_rsvp').upsert(
          { event_id: op.eventId, club_id: op.clubId, user_id: op.userId, status: op.status },
          { onConflict: 'event_id,user_id' }
        );
        if(error) throw error;
      } else if(op.type === 'rating_upsert'){
        const { error } = await sb.from('club_game_ratings').upsert(
          { club_id: op.clubId, game_id: op.gameId, stars: op.stars, updated_by: op.updatedBy },
          { onConflict: 'club_id,game_id' }
        );
        if(error) throw error;
      }
      anySucceeded = true;
    }catch(e){
      remaining.push(op); // bleibt in der Warteschlange, nächster Versuch später
    }
  }
  saveOfflineQueue(remaining);
  if(anySucceeded){
    await loadActiveClubData();
    if(state.tab==='club') renderClub();
    showToast(remaining.length ? 'Teilweise synchronisiert – Rest folgt' : 'Offline-Änderungen synchronisiert ✅');
  }
}
window.addEventListener('online', flushOfflineQueue);

function teardownRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function setupRealtime(clubId){
  if(!cloudEnabled) return;
  realtimeChannel = sb.channel('club-'+clubId)
    .on('postgres_changes', { event:'*', schema:'public', table:'club_events', filter:'club_id=eq.'+clubId }, async () => {
      const { data } = await sb.from('club_events').select('*').eq('club_id', clubId).order('datum', { ascending:true });
      cloud.events = data || [];
      if(state.tab==='club') renderClub();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'club_event_rsvp', filter:'club_id=eq.'+clubId }, async () => {
      const { data } = await sb.from('club_event_rsvp').select('*').eq('club_id', clubId);
      cloud.rsvps = data || [];
      if(state.tab==='club') renderClub();
      refreshOpenEventRsvpIfAny();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'club_game_ratings', filter:'club_id=eq.'+clubId }, async () => {
      const { data } = await sb.from('club_game_ratings').select('*').eq('club_id', clubId);
      cloud.ratings = {};
      (data||[]).forEach(r => { cloud.ratings[r.game_id] = r; });
      if(state.tab==='club') renderClub();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'club_members', filter:'club_id=eq.'+clubId }, async () => {
      const { data } = await sb.from('club_members').select('user_id, role, profiles ( display_name )').eq('club_id', clubId);
      cloud.members = data || [];
      if(state.tab==='club') renderClub();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'club_event_results', filter:'club_id=eq.'+clubId }, async () => {
      const { data } = await sb.from('club_event_results').select('*').eq('club_id', clubId);
      cloud.results = data || [];
      if(state.tab==='club') renderClub();
      refreshOpenEventResultsIfAny();
    })
    .subscribe();

      ).join('') + '</div>';
  }

  const officialFiltered = soloTagFilter ? officialGames.filter(g=>(g.tags||[]).includes(soloTagFilter)) : officialGames;
  const localFiltered = soloTagFilter ? state.games.filter(g=>(g.tags||[]).includes(soloTagFilter)) : state.games;

  if(officialGames.length){
    html += '<h2 class="section-title">⭐ Offizielle Spiele</h2>';
    html += '<p style="font-size:.82rem;color:var(--text-muted);margin:-6px 0 10px;">Zentral gepflegt, automatisch synchronisiert – nur lesbar.</p>';

    html += '<p style="font-size:.82rem;color:var(--text-muted);">⭐ Offizielle Spiele werden geladen, sobald du online bist...</p>';
  }

  html += '<h2 class="section-title">Eigener Spiele-Bestand</h2>';
  if(state.games.length === 0){
    html += emptyState('📋','Kein eigenes Spiel im Bestand.','Leg dein erstes Kegel-Spiel an.');
  } else if(localFiltered.length === 0){
    html += '<p style="font-size:.82rem;color:var(--text-muted);">Kein eigenes Spiel mit diesem Tag.</p>';
  } else {
    html += localFiltered.map(g => gameCard(g, false)).join('');

  el.innerHTML = html;

  $all('[data-tagfilter]', el).forEach(b => b.addEventListener('click', () => {

const modalContent = document.getElementById('modal-content');
function openModal(innerHtml){
  modalContent.innerHTML = '<div class="modal-inner-wrap"><button class="modal-close" id="modal-close-btn" aria-label="Schließen">✕</button>' + innerHtml + '</div>';
  overlay.classList.add('open');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
}
function closeModal(){
  overlay.classList.remove('open');
  modalContent.innerHTML = '';
}
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

/* =========================================================
   MODAL: Game form
   ========================================================= */
function openGameModal(id){
  const game = id ? state.games.find(g=>g.id===id) : null;
  const emojiRow = GAME_EMOJIS.map(e =>
    '<button type="button" class="emoji-opt '+(game && game.icon===e ? 'selected':'')+'" data-emoji="'+e+'">'+e+'</button>'
  ).join('');
  let selectedTags = game ? [...(game.tags||[])] : [];
  const tagsRow = () => GAME_TAGS.map(t =>
    '<button type="button" class="chip tag-opt '+(selectedTags.includes(t.id)?'selected':'')+'" data-tag="'+t.id+'">'+t.icon+' '+t.id+'</button>'
  ).join('');

  openModal(
    '<h2>'+(game?'Spiel bearbeiten':'Neues Spiel')+'</h2>'
    + '<div class="field"><label>Icon</label><div class="emoji-pick">'+emojiRow+'</div></div>'
    + '<div class="field"><label>Name</label><input type="text" id="g-name" value="'+(game?esc(game.name):'')+'" placeholder="z.B. Bierkegeln"></div>'
    + '<div class="field"><label>Beschreibung</label><textarea id="g-desc" placeholder="Kurze Regel-Erklärung...">'+(game?esc(game.beschreibung||''):'')+'</textarea></div>'
    + '<div class="two-col">'
      + '<div class="field"><label>Min. Spieler</label><input type="number" id="g-min" min="1" value="'+(game?game.minSpieler:2)+'"></div>'
      + '<div class="field"><label>Max. Spieler</label><input type="number" id="g-max" min="1" value="'+(game?game.maxSpieler:8)+'"></div>'
    + '</div>'
    + '<div class="field"><label>Dauer (Minuten)</label><input type="number" id="g-dauer" min="1" value="'+(game?game.dauer:20)+'"></div>'
    + '<div class="field"><label>Tags</label><div class="chip-row" id="g-tags">'+tagsRow()+'</div></div>'
    + '<div class="modal-actions">'
      + '<button class="btn btn-primary" id="g-save">Speichern</button>'
      + (game ? '<button class="btn btn-alert" id="g-delete">Löschen</button>' : '')
    + '</div>'
  );

  let selectedEmoji = game ? (game.icon || GAME_EMOJIS[0]) : GAME_EMOJIS[0];
  $all('.emoji-opt').forEach(btn => btn.addEventListener('click', () => {
    selectedEmoji = btn.dataset.emoji;
    $all('.emoji-opt').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }));
  if(!game){ $all('.emoji-opt')[0].classList.add('selected'); }

  $all('.tag-opt').forEach(btn => btn.addEventListener('click', () => {
    const tag = btn.dataset.tag;
    if(selectedTags.includes(tag)) selectedTags = selectedTags.filter(t=>t!==tag);
    else selectedTags.push(tag);
    btn.classList.toggle('selected');
  }));

  document.getElementById('g-save').addEventListener('click', () => {
    const name = document.getElementById('g-name').value.trim();
    if(!name){ showToast('Bitte einen Namen eintragen.'); return; }
    const data = {
      id: game ? game.id : uid(),
      icon: selectedEmoji,
      name,
      beschreibung: document.getElementById('g-desc').value.trim(),
      minSpieler: parseInt(document.getElementById('g-min').value,10) || 1,
      maxSpieler: parseInt(document.getElementById('g-max').value,10) || 1,
      dauer: parseInt(document.getElementById('g-dauer').value,10) || 10,
      tags: selectedTags
    };
    if(game){
      const idx = state.games.findIndex(g=>g.id===game.id);
      state.games[idx] = data;
    } else {
      state.games.push(data);
    }
    persistGames();
    renderGames();
    closeModal();
    showToast('Spiel gespeichert 🎳');
  });

  const delBtn = document.getElementById('g-delete');
  if(delBtn) delBtn.addEventListener('click', () => {
    state.games = state.games.filter(g=>g.id!==game.id);
    persistGames();
    renderGames();
    closeModal();
    showToast('Spiel gelöscht');
  });
}

let authState = { mode: 'login' };
let archivOpen = false;

function rsvpCounts(eventId){
  const rows = cloud.rsvps.filter(r => r.event_id === eventId);
  return {
    zugesagt: rows.filter(r=>r.status==='zugesagt').length,
    offen: rows.filter(r=>r.status==='offen').length,
    abgesagt: rows.filter(r=>r.status==='abgesagt').length
  };
}
function memberName(userId){
  const m = cloud.members.find(x=>x.user_id===userId);
  return m && m.profiles ? m.profiles.display_name : '...';
}
// Ergebnisse für ein bestimmtes Spiel eines Abends, sortiert nach Platz
function resultsFor(eventId, gameId){
  return cloud.results
    .filter(r => r.event_id===eventId && r.game_id===gameId)
    .sort((a,b) => a.platz - b.platz);
}
// König eines Abends: platz=1 beim als Königsspiel markierten Spiel
function koenigOf(ev){
  if(!ev.koenigsspiel_game_id) return null;
  const winner = resultsFor(ev.id, ev.koenigsspiel_game_id).find(r=>r.platz===1);
  return winner ? winner.user_id : null;
}
// Bestenliste: wie oft war wer König, über alle Abende des Clubs hinweg
function hallOfFame(){
  const counts = {};
  cloud.events.forEach(ev => {
    const koenigId = koenigOf(ev);
    if(koenigId) counts[koenigId] = (counts[koenigId]||0) + 1;
  });
  return Object.entries(counts)
    .map(([userId, count]) => ({ userId, count, name: memberName(userId) }))
    .sort((a,b) => b.count - a.count);
}

function clubEventCardHtml(ev, isPast){
  const counts = rsvpCounts(ev.id);
  const spieleCount = (ev.spiele||[]).length;
  const koenigId = koenigOf(ev);
  return '<div class="card club-event-card '+(isPast?'past':'')+'" data-id="'+ev.id+'" tabindex="0">'
    + '<div class="stamp">'+(isPast?'📦':'🎳')+'</div>'
    + '<h3>'+esc(ev.titel || ('Kegelabend am '+formatDateHuman(ev.datum)))+'</h3>'
    + '<div class="meta-row">📅 '+formatDateHuman(ev.datum)+' · '+esc((ev.uhrzeit||'').slice(0,5))+'</div>'
    + '<div class="meta-row">📍 '+esc(ev.ort||'Ort offen')+'</div>'
    + '<div class="meta-row">👥 '+counts.zugesagt+' zugesagt'+(counts.offen?(' · '+counts.offen+' offen'):'')+' &nbsp; 📋 '+spieleCount+' Spiele</div>'
    + (koenigId ? '<div class="meta-row">👑 König: '+esc(memberName(koenigId))+'</div>' : (ev.koenigsspiel_game_id ? '<div class="meta-row" style="color:var(--text-muted);">👑 Königsspiel noch ohne Ergebnis</div>' : ''))
  + '</div>';
}

      + 'Führe dazu <code>supabase-schema.sql</code> in deinem Supabase-Projekt aus (SQL Editor) und trage anschließend deine <code>SUPABASE_URL</code> und <code>SUPABASE_ANON_KEY</code> im Code dieser Datei ein.</div>';
    return;
  }
  if(cloud.passwordRecovery){
    document.getElementById('subtitle').textContent = 'Neues Passwort festlegen';
    el.innerHTML = '<h2 class="section-title">Neues Passwort festlegen</h2>'
      + '<p style="font-size:.85rem;color:var(--text-muted);margin-top:-6px;">Du kommst über den Link aus deiner E-Mail. Vergib jetzt ein neues Passwort für dein Konto.</p>'
      + '<div class="field"><label>Neues Passwort</label><input type="password" id="pw-new" autocomplete="new-password"></div>'
      + '<div class="field"><label>Neues Passwort wiederholen</label><input type="password" id="pw-new-repeat" autocomplete="new-password"></div>'
      + '<button class="btn btn-primary btn-block" id="pw-new-submit">Passwort speichern</button>'
      + '<p id="pw-new-msg" style="font-size:.85rem;margin-top:10px;"></p>';
    document.getElementById('pw-new-submit').addEventListener('click', async () => {
      const pw1 = document.getElementById('pw-new').value;
      const pw2 = document.getElementById('pw-new-repeat').value;
      const msg = document.getElementById('pw-new-msg');
      msg.textContent = '';
      if(!pw1 || pw1.length < 6){ msg.style.color='var(--alert)'; msg.textContent = 'Bitte mindestens 6 Zeichen verwenden.'; return; }
      if(pw1 !== pw2){ msg.style.color='var(--alert)'; msg.textContent = 'Die beiden Passwörter stimmen nicht überein.'; return; }
      try{
        await setNewPassword(pw1);
        cloud.passwordRecovery = false;
        history.replaceState(null, '', window.location.pathname);
        showToast('Passwort aktualisiert 🔒');
        renderClub();
      }catch(e){ msg.style.color='var(--alert)'; msg.textContent = e.message || 'Etwas ist schiefgelaufen.'; }
    });
    return;
  }
  if(!isLoggedIn()){
    document.getElementById('subtitle').textContent = 'Melde dich an, um deinen Club zu sehen';
    if(authState.mode === 'forgot'){
      el.innerHTML = '<h2 class="section-title">Passwort vergessen</h2>'
        + '<p style="font-size:.85rem;color:var(--text-muted);margin-top:-6px;">Gib deine E-Mail-Adresse ein, wir schicken dir einen Link zum Zurücksetzen.</p>'
        + '<div class="field"><label>E-Mail</label><input type="text" id="forgot-email" autocomplete="email" value="'+esc(authState.lastEmail||'')+'"></div>'
        + '<button class="btn btn-primary btn-block" id="forgot-submit">Reset-Link senden</button>'
        + '<button class="link-btn" id="forgot-back" style="margin-top:12px;">← Zurück zum Login</button>'
        + '<p id="forgot-msg" style="font-size:.85rem;margin-top:10px;"></p>';
      document.getElementById('forgot-back').addEventListener('click', () => { authState.mode='login'; renderClub(); });
      document.getElementById('forgot-submit').addEventListener('click', async () => {
        const email = document.getElementById('forgot-email').value.trim();
        const msg = document.getElementById('forgot-msg');
        msg.textContent = '';
        if(!email){ msg.style.color='var(--alert)'; msg.textContent = 'Bitte E-Mail-Adresse eingeben.'; return; }
        try{
          await requestPasswordReset(email);
          msg.style.color = 'var(--ok)';
          msg.textContent = 'E-Mail verschickt! Schau in dein Postfach und klick auf den Link, um ein neues Passwort zu vergeben.';
        }catch(e){ msg.style.color='var(--alert)'; msg.textContent = e.message || 'Etwas ist schiefgelaufen.'; }
      });
      return;
    }
    el.innerHTML = '<h2 class="section-title">Anmelden</h2>'
      + '<div class="auth-tabs">'
        + '<button data-authtab="login" class="'+(authState.mode==='login'?'active':'')+'">Login</button>'
        + '<button data-authtab="register" class="'+(authState.mode==='register'?'active':'')+'">Registrieren</button>'
      + '</div>'
      + (authState.mode==='register' ? '<div class="field"><label>Anzeigename</label><input type="text" id="auth-name" placeholder="Wie dich andere im Club sehen"></div>' : '')
      + '<div class="field"><label>E-Mail</label><input type="text" id="auth-email" autocomplete="email"></div>'
      + '<div class="field"><label>Passwort</label><input type="password" id="auth-pw" autocomplete="'+(authState.mode==='register'?'new-password':'current-password')+'"></div>'
      + '<button class="btn btn-primary btn-block" id="auth-submit">'+(authState.mode==='register'?'Registrieren':'Einloggen')+'</button>'
      + (authState.mode==='login' ? '<button class="link-btn" id="auth-forgot" style="margin-top:10px;">Passwort vergessen?</button>' : '')
      + '<p id="auth-msg" style="font-size:.85rem;margin-top:10px;"></p>';
    $all('[data-authtab]', el).forEach(b => b.addEventListener('click', () => { authState.mode = b.dataset.authtab; renderClub(); }));
    const forgotLink = document.getElementById('auth-forgot');
    if(forgotLink) forgotLink.addEventListener('click', () => {
      authState.lastEmail = (document.getElementById('auth-email').value||'').trim();
      authState.mode = 'forgot';
      renderClub();
    });
    document.getElementById('auth-submit').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pw = document.getElementById('auth-pw').value;
      const msg = document.getElementById('auth-msg');
      msg.textContent = '';
      if(!email || !pw){ msg.style.color='var(--alert)'; msg.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
      try{
        if(authState.mode==='register'){
          const name = (document.getElementById('auth-name').value||'').trim() || email.split('@')[0];
          await signUp(email, pw, name);
          msg.style.color = 'var(--ok)';
          msg.textContent = 'Fast geschafft! Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir geschickt haben.';

      + '<div class="card" style="cursor:default;"><h3>Club erstellen</h3>'
        + '<div class="field"><input type="text" id="new-club-name" placeholder="z.B. Kegelfreunde Köln"></div>'
        + '<button class="btn btn-primary btn-block" id="create-club-btn">Club erstellen</button></div>'
      + '<div class="card" style="cursor:default;"><h3>Club beitreten</h3>'
        + '<div class="field"><input type="text" id="join-club-code" placeholder="z.B. AB12CD" style="text-transform:uppercase;"></div>'
        + '<button class="btn btn-outline btn-block" id="join-club-btn">Beitreten</button></div>'
      + '<button class="link-btn" id="logout-btn">Abmelden</button>';
    document.getElementById('create-club-btn').addEventListener('click', async () => {
      const name = document.getElementById('new-club-name').value.trim();
      if(!name){ showToast('Bitte einen Namen eingeben.'); return; }
      try{ await createClub(name); await loadActiveClubData(); renderClub(); showToast('Club erstellt 🏛️'); }
      catch(e){ showToast('Fehler: '+(e.message||'unbekannt')); }
    });
    document.getElementById('join-club-btn').addEventListener('click', async () => {
      const code = document.getElementById('join-club-code').value.trim();
      if(!code){ showToast('Bitte einen Code eingeben.'); return; }
      try{ await joinClubByCode(code); await loadActiveClubData(); renderClub(); showToast('Club beigetreten 🎉'); }
      catch(e){ showToast('Fehler: '+(e.message||'Ungültiger Code')); }
    });
    document.getElementById('logout-btn').addEventListener('click', async () => { await signOut(); renderClub(); });
    return;
  }

  const club = activeClub();
  if(!club){ el.innerHTML = '<p>Lade Club...</p>'; return; }

  const now = new Date();
  const upcomingEvents = cloud.events
    .filter(ev => new Date(ev.datum + 'T' + (ev.uhrzeit||'00:00')) >= now)
    .sort((a,b) => new Date(a.datum+'T'+(a.uhrzeit||'00:00')) - new Date(b.datum+'T'+(b.uhrzeit||'00:00')));
  document.getElementById('subtitle').textContent = upcomingEvents[0]
    ? 'Nächster Abend: ' + formatDateHuman(upcomingEvents[0].datum) + ' · ' + (upcomingEvents[0].uhrzeit||'').slice(0,5)
    : club.name;

  let html = '';
  const pendingCount = pendingOfflineCount();
  if(cloud.offline){
    html += '<div class="offline-banner">📴 Offline – zeigt den letzten bekannten Stand. Änderungen werden übernommen, sobald wieder Internet da ist.</div>';
  } else if(pendingCount > 0){
    html += '<div class="offline-banner syncing">🔄 '+pendingCount+' Änderung'+(pendingCount>1?'en':'')+' wird synchronisiert...</div>';
  }
  if(cloud.myClubs.length > 1){
    html += '<div class="club-switcher"><select id="club-select">'
      + cloud.myClubs.map(c => '<option value="'+c.id+'" '+(c.id===cloud.activeClubId?'selected':'')+'>'+esc(c.name)+'</option>').join('')
      + '</select></div>';
  }
  html += '<h2 class="section-title" style="margin-top:0;">🏛️ '+esc(club.name)+'</h2>';
  html += '<div class="segmented">'
    + '<button data-clubtab="events" class="'+(cloud.clubTab==='events'?'active':'')+'">Abende</button>'
    + '<button data-clubtab="games" class="'+(cloud.clubTab==='games'?'active':'')+'">Spiele</button>'
    + '<button data-clubtab="hof" class="'+(cloud.clubTab==='hof'?'active':'')+'">Bestenliste</button>'
    + '<button data-clubtab="members" class="'+(cloud.clubTab==='members'?'active':'')+'">Mitglieder</button>'
  + '</div>';

  if(cloud.clubTab==='events'){
    const nowTs = new Date();
    const upcoming = cloud.events
      .filter(ev => new Date(ev.datum+'T'+(ev.uhrzeit||'00:00')) >= nowTs)
      .sort((a,b) => new Date(a.datum+'T'+(a.uhrzeit||'00:00')) - new Date(b.datum+'T'+(b.uhrzeit||'00:00')));

      .filter(ev => new Date(ev.datum+'T'+(ev.uhrzeit||'00:00')) < nowTs)
      .sort((a,b) => new Date(b.datum+'T'+(b.uhrzeit||'00:00')) - new Date(a.datum+'T'+(a.uhrzeit||'00:00')));

      }
    }
  } else if(cloud.clubTab==='games'){
    if(officialGames.length===0){
      html += '<p style="font-size:.85rem;color:var(--text-muted);">Noch keine Spiele im globalen Katalog. Ein Admin kann sie im Admin-Bereich anlegen.</p>';
    } else {
      html += officialGames.map(g => {
        const rating = cloud.ratings[g.id];
        const stars = rating ? rating.stars : 0;
        return '<div class="card" style="cursor:default;">'
          + '<div class="official-tag"><h3 style="margin:0;">'+esc(g.icon)+' '+esc(g.name)+'</h3>'
          + '<div class="star-rating" data-game="'+g.id+'">'
            + [1,2,3,4,5].map(n => '<button type="button" data-star="'+n+'" class="'+(n<=stars?'filled':'')+'">★</button>').join('')

      const medals = ['🥇','🥈','🥉'];
      html += '<div class="card" style="cursor:default;">' + hof.map((h,i) =>

          + '<div class="avatar" style="background:'+nameToColor(h.name)+';">'+esc(initials(h.name))+'</div>'
          + '<div class="fname">'+esc(h.name)+'</div>'
          + '<span class="hof-count">'+h.count+'× König</span>'
        + '</div>'
      ).join('') + '</div>';
    }
  } else {
    html += '<div class="card" style="cursor:default;">' + cloud.members.map(m => {
      const name = m.profiles ? m.profiles.display_name : '...';
      return '<div class="friend-row"><div class="avatar" style="background:'+nameToColor(name)+';">'+esc(initials(name))+'</div>'
        + '<div class="fname">'+esc(name)+(m.role==='owner'?' <span class="badge outline">Owner</span>':'')+'</div></div>';
    }).join('') + '</div>';
    html += '<p style="font-size:.85rem;color:var(--text-muted);">Einladungscode: <strong>'+esc(club.invite_code)+'</strong> – teile ihn, damit andere beitreten können.</p>';
    html += '<button class="btn btn-outline btn-block" id="leave-club-btn" style="margin-top:6px;">Club verlassen</button>';
    html += '<button class="link-btn" id="logout-btn2" style="display:block;margin-top:14px;">Abmelden</button>';
  }
  el.innerHTML = html;

  const sel = document.getElementById('club-select');
  if(sel) sel.addEventListener('change', async () => {
    cloud.activeClubId = sel.value;
    saveData('kegel_active_club', cloud.activeClubId);
    await loadActiveClubData();
    renderClub();
  });
  $all('[data-clubtab]', el).forEach(b => b.addEventListener('click', () => { cloud.clubTab = b.dataset.clubtab; renderClub(); updateFabVisibility(); }));

  if(cloud.clubTab==='events'){
    $all('.club-event-card', el).forEach(c => c.addEventListener('click', () => openClubEventModal(c.dataset.id)));
    const addCard = document.getElementById('add-club-event-card');
    if(addCard) addCard.addEventListener('click', () => openClubEventModal(null));
    const toggleBtn = document.getElementById('toggle-archiv');
    if(toggleBtn) toggleBtn.addEventListener('click', () => { archivOpen = !archivOpen; renderClub(); });
  } else if(cloud.clubTab==='games'){
    $all('.star-rating', el).forEach(row => {
      $all('button', row).forEach(btn => btn.addEventListener('click', async () => {
        const gameId = row.dataset.game;
        const stars = parseInt(btn.dataset.star,10);
        try{
          const { error } = await sb.from('club_game_ratings').upsert(
            { club_id: cloud.activeClubId, game_id: gameId, stars, updated_by: cloud.session.user.id },
            { onConflict: 'club_id,game_id' }
          );
          if(error) throw error;
          cloud.ratings[gameId] = { stars };
          renderClub();
        }catch(e){
          queueOfflineWrite({ type:'rating_upsert', clubId: cloud.activeClubId, gameId, stars, updatedBy: cloud.session.user.id });
          cloud.ratings[gameId] = { stars };
          renderClub();
          showToast('📴 Offline gespeichert – wird synchronisiert, sobald wieder Internet da ist');
        }
      }));
    });
  } else {
    const leaveBtn = document.getElementById('leave-club-btn');
    if(leaveBtn) leaveBtn.addEventListener('click', async () => {
      if(!confirm('Diesen Club wirklich verlassen?')) return;
      await leaveClub(cloud.activeClubId);
      renderClub();
    });
    const logoutBtn2 = document.getElementById('logout-btn2');
    if(logoutBtn2) logoutBtn2.addEventListener('click', async () => { await signOut(); renderClub(); });
  }
}

/* ---------- Modal: Club-Kegelabend (live geteilt) ---------- */
function openClubEventModal(id){
  const ev = id ? cloud.events.find(e=>e.id===id) : null;
  let selectedGames = ev ? [...(ev.spiele||[])] : [];
  let koenigGameId = ev ? (ev.koenigsspiel_game_id || null) : null;
  // Lokale, sofort sichtbare Arbeitskopie der Ergebnisse je Spiel:
  // { [gameId]: [userId, userId, ...] } in Platzierungsreihenfolge (Index 0 = Platz 1).
  // Wird bei jedem Klick SOFORT aktualisiert (optimistisch), das Speichern läuft
  // im Hintergrund über eine serialisierte Warteschlange, damit schnelles
  // Hintereinander-Tippen die Reihenfolge nicht durcheinanderbringt.
  let localResults = {};
  if(ev){
    selectedGames.forEach(gid => { localResults[gid] = resultsFor(ev.id, gid).map(r=>r.user_id); });
  }
  let writeChain = Promise.resolve();
  function queueWrite(fn){
    writeChain = writeChain.then(fn).catch(() => showToast('Änderung konnte nicht gespeichert werden.'));
    return writeChain;
  }

  function gamesChipsHtml(){
    if(officialGames.length===0) return '<p style="font-size:.85rem;color:var(--text-muted);">Noch keine Spiele im globalen Katalog.</p>';
    return '<div class="chip-row">' + officialGames.map(g =>
      '<button type="button" class="chip '+(selectedGames.includes(g.id)?'selected':'')+'" data-game="'+g.id+'">'+esc(g.icon)+' '+esc(g.name)+'</button>'
    ).join('') + '</div>';
  }
  function gamesOrderHtml(){
    if(selectedGames.length===0) return '<p style="font-size:.85rem;color:var(--text-muted);">Noch keine Spiele ausgewählt.</p>';
    return '<p style="font-size:.78rem;color:var(--text-muted);margin:2px 0 8px;">👑 antippen, um das Königsspiel des Abends festzulegen.</p>'
      + '<div class="game-pick-list">' + selectedGames.map((gid,i) => {
      const g = officialGames.find(x=>x.id===gid);
      if(!g) return '';
      return '<div class="game-pick-item">'
        + '<button type="button" class="crown-btn '+(koenigGameId===gid?'active':'')+'" data-crown="'+gid+'" title="Als Königsspiel markieren">👑</button>'
        + '<span class="gname">'+(i+1)+'. '+esc(g.icon)+' '+esc(g.name)+'</span>'
        + '<button type="button" data-order-up="'+gid+'" '+(i===0?'disabled':'')+'>▲</button>'
        + '<button type="button" data-order-down="'+gid+'" '+(i===selectedGames.length-1?'disabled':'')+'>▼</button>'
        + '<button type="button" data-remove-game="'+gid+'">✕</button>'
      + '</div>';
    }).join('') + '</div>';
  }
  function confirmedParticipants(){
    if(!ev) return [];
    return cloud.rsvps
      .filter(r => r.event_id===ev.id && r.status==='zugesagt')
      .map(r => ({ user_id: r.user_id, name: memberName(r.user_id) }));
  }
  function resultBlockHtml(gid){
    const g = officialGames.find(x=>x.id===gid);
    if(!g) return '';
    const isKoenig = koenigGameId === gid;
    const participants = confirmedParticipants();
    const rankedIds = localResults[gid] || [];
    const pool = participants.filter(p => !rankedIds.includes(p.user_id));
    return '<div class="result-block '+(isKoenig?'is-koenig':'')+'">'
      + '<h4>'+(isKoenig ? '👑 Königsspiel: '+esc(g.name) : esc(g.icon)+' '+esc(g.name))+'</h4>'
      + (participants.length===0 ? '<p style="font-size:.8rem;color:var(--text-muted);">Noch niemand zugesagt – erst Rückmeldungen sammeln.</p>' : '')
      + (rankedIds.length ? '<div class="rank-list">' + rankedIds.map((uid,i) =>
          '<div class="rank-item"><span class="rank-num">'+(i+1)+(isKoenig && i===0?'. 👑':'.')+'</span><span class="rname">'+esc(memberName(uid))+'</span><button type="button" data-unrank="'+gid+'|'+uid+'">✕</button></div>'
        ).join('') + '</div>' : '')
      + (pool.length ? '<div class="pool-chips">' + pool.map(p =>
          '<button type="button" class="winner-chip" data-rank-add="'+gid+'|'+p.user_id+'">+ '+esc(p.name)+'</button>'
        ).join('') + '</div>' : '')
    + '</div>';
  }
  function resultsBlockHtml(){
    if(!ev || selectedGames.length===0) return '<p style="font-size:.83rem;color:var(--text-muted);">Nach dem Speichern und Auswählen von Spielen kannst du hier Ergebnisse eintragen.</p>';
    return selectedGames.map(gid => resultBlockHtml(gid)).join('');
  }
  function rsvpListHtml(){
    if(!ev) return '<p style="font-size:.83rem;color:var(--text-muted);">Nach dem Speichern kannst du hier sehen, wer zugesagt hat.</p>';
    const rows = cloud.rsvps.filter(r => r.event_id === ev.id);
    if(rows.length===0) return '<p style="font-size:.83rem;color:var(--text-muted);">Noch keine Rückmeldungen.</p>';
    return rows.map(r => {
      const member = cloud.members.find(m=>m.user_id===r.user_id);
      const name = member && member.profiles ? member.profiles.display_name : '...';
      const icon = r.status==='zugesagt'?'✅':r.status==='abgesagt'?'❌':'❓';
      return '<div class="rsvp-readonly"><span class="rstatus">'+icon+'</span> '+esc(name)+'</div>';
    }).join('');
  }
  function myStatus(){
    if(!ev || !cloud.session) return null;
    const row = cloud.rsvps.find(r=>r.event_id===ev.id && r.user_id===cloud.session.user.id);
    return row ? row.status : null;
  }

  function bodyHtml(){
    const st = myStatus();
    return '<h2>'+(ev?'Kegelabend bearbeiten':'Neuer Kegelabend')+'</h2>'
      + '<p style="font-size:.8rem;color:var(--text-muted);margin-top:-8px;">Sichtbar &amp; bearbeitbar für alle Mitglieder von '+esc(activeClub()?activeClub().name:'')+'.</p>'
      + '<div class="field"><label>Titel (optional)</label><input type="text" id="ce-titel" value="'+(ev?esc(ev.titel||''):'')+'" placeholder="z.B. Sommer-Kegeln"></div>'
      + '<div class="two-col">'
        + '<div class="field"><label>Datum</label><input type="date" id="ce-datum" value="'+(ev?ev.datum:'')+'"></div>'
        + '<div class="field"><label>Uhrzeit</label>'+timeSelectHtml('ce-uhrzeit', ev?(ev.uhrzeit||'20:00'):'20:00')+'</div>'
      + '</div>'
      + '<div class="field"><label>Ort</label><input type="text" id="ce-ort" value="'+(ev?esc(ev.ort||''):'')+'" placeholder="z.B. Kegelbahn Krönchen"></div>'
      + '<div class="field"><label>Notizen</label><textarea id="ce-notizen" placeholder="z.B. Wer bringt was mit?">'+(ev?esc(ev.notizen||''):'')+'</textarea></div>'
      + '<h2 class="section-title" style="margin-top:22px;">Spiele für den Abend</h2>'
      + '<div id="ce-games-chips">'+gamesChipsHtml()+'</div>'
      + '<div id="ce-games-order">'+gamesOrderHtml()+'</div>'
      + (ev ? (
          '<h2 class="section-title" style="margin-top:22px;">Deine Rückmeldung</h2>'
          + '<div class="rsvp-group" style="margin-bottom:14px;">'
            + '<button type="button" class="rsvp-btn '+(st==='zugesagt'?'active ok':'')+'" data-mystatus="zugesagt" title="Zugesagt">✅</button>'
            + '<button type="button" class="rsvp-btn '+(st==='offen'?'active pending':'')+'" data-mystatus="offen" title="Offen">❓</button>'
            + '<button type="button" class="rsvp-btn '+(st==='abgesagt'?'active declined':'')+'" data-mystatus="abgesagt" title="Abgesagt">❌</button>'
          + '</div>'
          + '<h2 class="section-title">Wer kommt?</h2>'
          + '<div id="ce-rsvp-list">'+rsvpListHtml()+'</div>'
          + '<h2 class="section-title" style="margin-top:22px;">Ergebnisse</h2>'
          + '<div id="ce-results">'+resultsBlockHtml()+'</div>'
        ) : '')
      + '<div class="modal-actions">'
        + '<button class="btn btn-primary" id="ce-save">Speichern</button>'
        + (ev ? '<button class="btn btn-alert" id="ce-delete">Löschen</button>' : '')
      + '</div>';
  }

  function refreshGamesBlocks(){
    document.getElementById('ce-games-chips').innerHTML = gamesChipsHtml();
    document.getElementById('ce-games-order').innerHTML = gamesOrderHtml();
    const resultsEl = document.getElementById('ce-results');
    if(resultsEl) resultsEl.innerHTML = resultsBlockHtml();
    attachHandlers();
  }
  async function setKoenigGame(gid){
    const newVal = koenigGameId === gid ? null : gid;
    koenigGameId = newVal;
    refreshGamesBlocks();
    if(ev){
      queueWrite(async () => {
        const { error } = await sb.from('club_events').update({ koenigsspiel_game_id: newVal }).eq('id', ev.id);
        if(error) throw error;
        ev.koenigsspiel_game_id = newVal;
        const idx = cloud.events.findIndex(e=>e.id===ev.id);
        if(idx>=0) cloud.events[idx].koenigsspiel_game_id = newVal;
        renderClub();
      });
    }
  }
  // Schreibt den kompletten lokalen Stand für EIN Spiel in einem Rutsch in die
  // Datenbank (alle alten Zeilen löschen, dann alle aktuellen neu anlegen).
  // Das macht jede einzelne Speicherung in sich konsistent - es gibt keinen
  // Zwischenzustand, den ein zweiter, fast gleichzeitiger Klick durcheinander
  // bringen könnte, weil alle Schreibvorgänge über writeChain nacheinander
  // (nie überlappend) ausgeführt werden.
  function syncResultsForGame(gid){
    const ids = [...(localResults[gid] || [])];
    queueWrite(async () => {
      try{
        await sb.from('club_event_results').delete().eq('event_id', ev.id).eq('game_id', gid);
        if(ids.length){
          const rows = ids.map((uid,i) => ({
            event_id: ev.id, club_id: cloud.activeClubId, game_id: gid,
            user_id: uid, platz: i+1, updated_by: cloud.session.user.id
          }));
          const { error } = await sb.from('club_event_results').insert(rows);
          if(error) throw error;
        }
        cloud.results = cloud.results.filter(r => !(r.event_id===ev.id && r.game_id===gid));
        ids.forEach((uid,i) => cloud.results.push({ event_id: ev.id, club_id: cloud.activeClubId, game_id: gid, user_id: uid, platz: i+1 }));
        renderClub();
      }catch(e){
        // Kein Netz (oder Server nicht erreichbar): Änderung trotzdem lokal
        // übernehmen und für später vormerken, statt sie zu verwerfen.
        queueOfflineWrite({ type:'results_sync', eventId: ev.id, gameId: gid, clubId: cloud.activeClubId, userIds: ids, updatedBy: cloud.session.user.id });
        cloud.results = cloud.results.filter(r => !(r.event_id===ev.id && r.game_id===gid));
        ids.forEach((uid,i) => cloud.results.push({ event_id: ev.id, club_id: cloud.activeClubId, game_id: gid, user_id: uid, platz: i+1 }));
        renderClub();
        showToast('📴 Offline gespeichert – wird synchronisiert, sobald wieder Internet da ist');
      }
    });
  }
  function addRank(gid, userId){
    localResults[gid] = localResults[gid] || [];
    if(!localResults[gid].includes(userId)) localResults[gid].push(userId);
    refreshGamesBlocks();
    syncResultsForGame(gid);
  }
  function removeRank(gid, userId){
    localResults[gid] = (localResults[gid] || []).filter(id => id!==userId);
    refreshGamesBlocks();
    syncResultsForGame(gid);
  }
  function attachHandlers(){
    $all('.chip[data-game]').forEach(chip => chip.addEventListener('click', () => {
      const gid = chip.dataset.game;
      const idx = selectedGames.indexOf(gid);
      if(idx>=0) selectedGames.splice(idx,1); else selectedGames.push(gid);
      if(!localResults[gid]) localResults[gid] = [];
      refreshGamesBlocks();
    }));
    $all('[data-order-up]').forEach(b => b.addEventListener('click', () => {
      const gid=b.dataset.orderUp, idx=selectedGames.indexOf(gid);
      if(idx>0){ [selectedGames[idx-1],selectedGames[idx]]=[selectedGames[idx],selectedGames[idx-1]]; refreshGamesBlocks(); }
    }));
    $all('[data-order-down]').forEach(b => b.addEventListener('click', () => {
      const gid=b.dataset.orderDown, idx=selectedGames.indexOf(gid);
      if(idx<selectedGames.length-1){ [selectedGames[idx+1],selectedGames[idx]]=[selectedGames[idx],selectedGames[idx+1]]; refreshGamesBlocks(); }
    }));
    $all('[data-remove-game]').forEach(b => b.addEventListener('click', () => {
      selectedGames = selectedGames.filter(gid=>gid!==b.dataset.removeGame);
      refreshGamesBlocks();
    }));
    $all('[data-crown]').forEach(b => b.addEventListener('click', () => setKoenigGame(b.dataset.crown)));
    $all('[data-rank-add]').forEach(b => b.addEventListener('click', () => {
      const [gid, userId] = b.dataset.rankAdd.split('|');
      addRank(gid, userId);
    }));
    $all('[data-unrank]').forEach(b => b.addEventListener('click', () => {
      const [gid, userId] = b.dataset.unrank.split('|');
      removeRank(gid, userId);
    }));
    $all('[data-mystatus]').forEach(b => b.addEventListener('click', async () => {
      const status = b.dataset.mystatus;
      try{
        const { error } = await sb.from('club_event_rsvp').upsert(
          { event_id: ev.id, club_id: cloud.activeClubId, user_id: cloud.session.user.id, status },
          { onConflict: 'event_id,user_id' }
        );
        if(error) throw error;
        const existing = cloud.rsvps.find(r=>r.event_id===ev.id && r.user_id===cloud.session.user.id);
        if(existing) existing.status = status;
        else cloud.rsvps.push({ event_id: ev.id, club_id: cloud.activeClubId, user_id: cloud.session.user.id, status });
        refreshModalBody();
      }catch(e){
        queueOfflineWrite({ type:'rsvp_upsert', eventId: ev.id, clubId: cloud.activeClubId, userId: cloud.session.user.id, status });
        const existing = cloud.rsvps.find(r=>r.event_id===ev.id && r.user_id===cloud.session.user.id);
        if(existing) existing.status = status;
        else cloud.rsvps.push({ event_id: ev.id, club_id: cloud.activeClubId, user_id: cloud.session.user.id, status });
        refreshModalBody();
        showToast('📴 Offline gespeichert – wird synchronisiert, sobald wieder Internet da ist');
      }
    }));
    const saveBtn = document.getElementById('ce-save');
    if(saveBtn) saveBtn.addEventListener('click', saveClubEvent);
    const delBtn = document.getElementById('ce-delete');
    if(delBtn) delBtn.addEventListener('click', async () => {
      if(!confirm('Diesen Kegelabend wirklich löschen?')) return;
      try{
        await sb.from('club_events').delete().eq('id', ev.id);
        cloud.events = cloud.events.filter(e=>e.id!==ev.id);
        renderClub();
        closeModal();
        showToast('Kegelabend gelöscht');
      }catch(e){ showToast('Fehler beim Löschen.'); }
    });
  }
  function refreshModalBody(){
    modalContent.innerHTML = '<div class="modal-inner-wrap"><button class="modal-close" id="modal-close-btn" aria-label="Schließen">✕</button>' + bodyHtml() + '</div>';
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    attachHandlers();
  }
  async function saveClubEvent(){
    const datum = document.getElementById('ce-datum').value;
    if(!datum){ showToast('Bitte ein Datum wählen.'); return; }
    const payload = {
      club_id: cloud.activeClubId,
      titel: document.getElementById('ce-titel').value.trim(),
      datum,
      uhrzeit: readTimeSelect('ce-uhrzeit'),
      ort: document.getElementById('ce-ort').value.trim(),
      notizen: document.getElementById('ce-notizen').value.trim(),
      spiele: selectedGames,
      koenigsspiel_game_id: koenigGameId
    };
    try{
      let savedId;
      if(ev){
        const { error } = await sb.from('club_events').update(payload).eq('id', ev.id);
        if(error) throw error;
        savedId = ev.id;
      } else {
        payload.created_by = cloud.session.user.id;
        const { data, error } = await sb.from('club_events').insert(payload).select().single();
        if(error) throw error;
        savedId = data.id;
        await sb.from('club_event_rsvp').upsert(
          { event_id: savedId, club_id: cloud.activeClubId, user_id: cloud.session.user.id, status: 'zugesagt' },
          { onConflict: 'event_id,user_id' }
        );
      }
      await loadActiveClubData();
      renderClub();
      closeModal();
      showToast('Kegelabend gespeichert 🎳');
    }catch(e){ showToast('Fehler beim Speichern: '+(e.message||'unbekannt')); }
  }

  openModal(bodyHtml());
  attachHandlers();
  refreshOpenEventRsvpIfAny = function(){
    const list = document.getElementById('ce-rsvp-list');
    if(ev && list) list.innerHTML = rsvpListHtml();
  };
  // Absichtlich kein Auto-Refresh der Ergebnisse aus Realtime-Events mehr,
  // solange dieses Modal offen ist: der lokale Stand (localResults) ist
  // hier die "Quelle der Wahrheit", während man aktiv Platzierungen einträgt.
  // Andere Ansichten (Eventliste, Bestenliste) aktualisieren sich unabhängig
  // davon trotzdem live über cloud.results.
  refreshOpenEventResultsIfAny = function(){};
}

/* =========================================================
   RENDER: ADMIN (zentraler Spiele-Katalog)
   ========================================================= */
function renderAdmin(){
  const el = document.getElementById('view-admin');
  if(!isAdmin()){ el.innerHTML = ''; return; }
  let html = '<h2 class="section-title">🛠️ Globaler Spiele-Katalog</h2>';
  html += '<p style="font-size:.82rem;color:var(--text-muted);margin:-6px 0 10px;">Änderungen sind sofort für alle Clubs sichtbar.</p>';
  if(officialGames.length===0){
    html += emptyState('🛠️','Noch kein offizielles Spiel angelegt.','Leg das erste Spiel im globalen Katalog an.');
  } else {
    html += '<div id="admin-game-list">' + officialGames.map(g => gameCard(g, false)).join('') + '</div>';
  }
  html += '<div class="card dashed" id="add-admin-game-card">+ Neues offizielles Spiel</div>';
  el.innerHTML = html;
  $all('#admin-game-list .game-card', el).forEach(c => c.addEventListener('click', () => openAdminGameModal(c.dataset.id)));
  const addCard = document.getElementById('add-admin-game-card');
  if(addCard) addCard.addEventListener('click', () => openAdminGameModal(null));
}

function openAdminGameModal(id){
  const game = id ? officialGames.find(g=>g.id===id) : null;
  const emojiRow = GAME_EMOJIS.map(e =>
    '<button type="button" class="emoji-opt '+(game && game.icon===e ? 'selected':'')+'" data-emoji="'+e+'">'+e+'</button>'
  ).join('');
  let selectedTags = game ? [...(game.tags||[])] : [];
  const tagsRow = () => GAME_TAGS.map(t =>
    '<button type="button" class="chip tag-opt '+(selectedTags.includes(t.id)?'selected':'')+'" data-tag="'+t.id+'">'+t.icon+' '+t.id+'</button>'
  ).join('');
  openModal(
    '<h2>'+(game?'Offizielles Spiel bearbeiten':'Neues offizielles Spiel')+'</h2>'
    + '<div class="field"><label>Icon</label><div class="emoji-pick">'+emojiRow+'</div></div>'
    + '<div class="field"><label>Name</label><input type="text" id="ag-name" value="'+(game?esc(game.name):'')+'" placeholder="z.B. Bierkegeln"></div>'
    + '<div class="field"><label>Beschreibung</label><textarea id="ag-desc">'+(game?esc(game.beschreibung||''):'')+'</textarea></div>'
    + '<div class="two-col">'
      + '<div class="field"><label>Min. Spieler</label><input type="number" id="ag-min" min="1" value="'+(game?game.minSpieler:2)+'"></div>'
      + '<div class="field"><label>Max. Spieler</label><input type="number" id="ag-max" min="1" value="'+(game?game.maxSpieler:8)+'"></div>'
    + '</div>'
    + '<div class="field"><label>Dauer (Minuten)</label><input type="number" id="ag-dauer" min="1" value="'+(game?game.dauer:20)+'"></div>'
    + '<div class="field"><label>Tags</label><div class="chip-row" id="ag-tags">'+tagsRow()+'</div></div>'
    + '<div class="modal-actions">'
      + '<button class="btn btn-primary" id="ag-save">Speichern</button>'
      + (game ? '<button class="btn btn-alert" id="ag-delete">Löschen</button>' : '')
    + '</div>'
  );
  let selectedEmoji = game ? (game.icon || GAME_EMOJIS[0]) : GAME_EMOJIS[0];
  $all('.emoji-opt').forEach(btn => btn.addEventListener('click', () => {
    selectedEmoji = btn.dataset.emoji;
    $all('.emoji-opt').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }));
  if(!game){ $all('.emoji-opt')[0].classList.add('selected'); }

  $all('.tag-opt').forEach(btn => btn.addEventListener('click', () => {
    const tag = btn.dataset.tag;
    if(selectedTags.includes(tag)) selectedTags = selectedTags.filter(t=>t!==tag);
    else selectedTags.push(tag);
    btn.classList.toggle('selected');
  }));

  document.getElementById('ag-save').addEventListener('click', async () => {
    const name = document.getElementById('ag-name').value.trim();
    if(!name){ showToast('Bitte einen Namen eintragen.'); return; }
    const payload = {
      icon: selectedEmoji,
      name,
      beschreibung: document.getElementById('ag-desc').value.trim(),
      min_spieler: parseInt(document.getElementById('ag-min').value,10) || 1,
      max_spieler: parseInt(document.getElementById('ag-max').value,10) || 1,
      dauer: parseInt(document.getElementById('ag-dauer').value,10) || 10,
      tags: selectedTags
    };
    try{
      if(game){
        const { error } = await sb.from('games').update(payload).eq('id', game.id);
        if(error) throw error;
      } else {
        payload.created_by = cloud.session.user.id;
        const { error } = await sb.from('games').insert(payload);
        if(error) throw error;
      }
      await refreshOfficialGames();
      renderAdmin();
      if(state.tab==='games') renderGames();
      closeModal();
      showToast('Gespeichert 🎳');
    }catch(e){ showToast('Fehler: '+(e.message||'unbekannt')); }
  });
  const delBtn = document.getElementById('ag-delete');
  if(delBtn) delBtn.addEventListener('click', async () => {
    if(!confirm('Dieses offizielle Spiel wirklich löschen?')) return;
    try{
      const { error } = await sb.from('games').delete().eq('id', game.id);
      if(error) throw error;
      await refreshOfficialGames();
      renderAdmin();
      closeModal();
      showToast('Gelöscht');
    }catch(e){ showToast('Fehler: '+(e.message||'unbekannt')); }
  });
}

/* ---------- Tabs & FAB ---------- */
function setTab(tab){
  state.tab = tab;
  $all('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  $all('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderAll();
}
$all('#tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

function updateFabVisibility(){
  const fab = document.getElementById('fab');
  if(state.tab==='club'){
    fab.style.display = (isLoggedIn() && activeClub() && cloud.clubTab==='events') ? 'flex' : 'none';
  } else if(state.tab==='admin'){
    fab.style.display = isAdmin() ? 'flex' : 'none';
  } else {
    fab.style.display = 'flex';
  }
}

document.getElementById('fab').addEventListener('click', () => {
  if(state.tab==='games') openGameModal(null);
  else if(state.tab==='club'){ if(isLoggedIn() && activeClub() && cloud.clubTab==='events') openClubEventModal(null); }
  else if(state.tab==='admin'){ if(isAdmin()) openAdminGameModal(null); }
});

function renderAll(){
  renderGames();
  renderClub();
  renderAdmin();
  updateFabVisibility();
}
renderAll();
initCloud();

/* ---------- Diagnose-Hilfe (temporär) ----------
   Gibt keine neuen Rechte frei - sb/cloud haben ohnehin nur die
   Berechtigungen deines eigenen eingeloggten Kontos. Dient nur dazu,
   den aktuellen Auth-/Session-Zustand direkt in der Browser-Konsole
   (F12 -> Console) inspizieren zu können, z.B. mit:
     await window.__kegelDebug.checkAuth()
*/
window.__kegelDebug = {
  cloudEnabled,
  get session(){ return cloud.session; },
  get profile(){ return cloud.profile; },
  async checkAuth(){
    if(!sb){ console.log('Supabase-Client ist nicht initialisiert (cloudEnabled=false).'); return; }
    const { data, error } = await sb.auth.getSession();
    console.log('getSession() Fehler:', error);
    console.log('Session vorhanden:', !!data.session);
    if(data.session){
      console.log('user.id (sollte einer echten UUID entsprechen):', data.session.user.id);
      console.log('access_token vorhanden:', !!data.session.access_token);
      console.log('access_token läuft ab um:', new Date(data.session.expires_at*1000).toLocaleString());
      const payload = JSON.parse(atob(data.session.access_token.split('.')[1]));
      console.log('Im Token enthaltene Rolle (sollte "authenticated" sein):', payload.role);
      console.log('Im Token enthaltene User-ID (sub):', payload.sub);
    }
    console.log('cloud.session.user.id (von der App zwischengespeichert):', cloud.session ? cloud.session.user.id : null);
  }
};

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
