<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kegelabend Planer</title>
<meta name="description" content="Plane deinen nächsten Kegelabend mit Freunden – einfach, offline, mit Spaß.">
<meta name="theme-color" content="#1E3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kegelabend">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#F3EAD3;
    --surface:#FFFDF6;
    --dark:#1E3B2C;
    --dark-2:#152B1E;
    --accent:#D9A441;
    --accent-dark:#B8842E;
    --alert:#A23E33;
    --ok:#3F6B4A;
    --wood:#5B3A29;
    --text:#2B2118;
    --text-muted:#7a6a56;
    --radius:16px;
    --shadow:0 3px 10px rgba(43,33,24,.14);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wood);
    color:var(--text);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.35);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(217,164,65,.07), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(30,59,44,.05), transparent 40%);
  }
  header.appbar{
    background:var(--dark);
    background-image:linear-gradient(180deg, var(--dark), var(--dark-2));
    color:var(--bg);
    padding:20px 20px 16px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:3px solid var(--accent);
  }
  header.appbar h1{
    margin:0;
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-shadow:2px 2px 0 rgba(217,164,65,.25);
  }
  header.appbar p{
    margin:6px 0 0;
    font-size:.85rem;
    color:rgba(243,234,211,.8);
    font-family:var(--font-mono);
  }
  #banner-storage{
    display:none;
    background:var(--alert);
    color:#fff;
    font-size:.78rem;
    padding:8px 16px;
    text-align:center;
    line-height:1.4;
  }
  main{
    flex:1;
    padding:16px 16px 100px;
    overflow-y:auto;
  }
  .view{display:none;}
  .view.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .view.active{animation:none;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  h2.section-title{
    font-size:.95rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--wood);
    font-weight:800;
    margin:20px 0 10px;
  }
  h2.section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border:1px solid rgba(91,58,41,.1);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
    position:relative;
    cursor:pointer;
  }
  .card:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible{
    outline:3px solid var(--accent-dark);
    outline-offset:2px;
  }
  .card .stamp{
    position:absolute;
    top:-12px;
    right:14px;
    width:46px;height:46px;
    border-radius:50%;
    border:2px dashed var(--dark);
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    font-size:1.2rem;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .card h3{margin:0 0 4px;font-size:1.05rem;font-weight:800;padding-right:40px;}
  .card .meta-row{
    font-family:var(--font-mono);
    font-size:.82rem;
    color:var(--text-muted);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .card.dashed{
    border:2px dashed var(--wood);
    background:transparent;
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--wood);
    font-weight:700;
    min-height:64px;
  }
  .card.past{opacity:.55;}

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--wood);
  }
  .empty-state .emoji{font-size:2.4rem;display:block;margin-bottom:10px;}
  .empty-state p{margin:0 0 16px;line-height:1.5;}

  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:.95rem;
  }
  .btn-primary{background:var(--accent);color:var(--dark);}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-outline{background:transparent;color:var(--dark);border:2px solid var(--dark);}
  .btn-alert{background:transparent;color:var(--alert);border:2px solid var(--alert);}
  .btn-block{width:100%;}

  nav.tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid rgba(91,58,41,.15);
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    padding:10px 4px 12px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:.72rem;
    font-weight:700;
    border-top:3px solid transparent;
  }
  nav.tabbar button .icon{font-size:1.3rem;}
  nav.tabbar button.active{color:var(--dark);border-top-color:var(--accent);}

  .fab{
    position:fixed;
    right:calc(50% - 240px + 20px);
    bottom:76px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--dark);
    font-size:1.6rem;
    font-weight:800;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    z-index:11;
  }
  @media (max-width:480px){
    .fab{right:20px;}
  }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--wood);
    background:var(--surface);
    color:var(--text);
    font-size:.85rem;
    font-weight:600;
  }
  .chip.selected{background:var(--accent);border-color:var(--accent-dark);color:var(--dark);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(21,43,30,.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .modal h2{margin:0 0 16px;font-size:1.15rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--dark);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.8rem;font-weight:700;color:var(--wood);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid rgba(91,58,41,.3);
    background:var(--surface);
    font-family:inherit;
    font-size:.95rem;
    color:var(--text);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .two-col{display:flex;gap:10px;}
  .two-col .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal-actions .btn{flex:1;min-width:110px;}
  .modal-close{
    position:absolute;top:14px;right:14px;
    background:rgba(91,58,41,.1);
    width:32px;height:32px;border-radius:50%;
    font-size:1.1rem;color:var(--wood);
  }
  .modal-inner-wrap{position:relative;}

  .friend-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;
    border-bottom:1px solid rgba(91,58,41,.08);
  }
  .friend-row:last-child{border-bottom:none;}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:.85rem;flex-shrink:0;
  }
  .friend-row .fname{flex:1;font-weight:600;}
  .rsvp-group{display:flex;gap:4px;}
  .rsvp-btn{
    width:30px;height:30px;border-radius:8px;
    background:var(--surface);border:1.5px solid rgba(91,58,41,.25);
    font-size:.9rem;opacity:.4;
  }
  .rsvp-btn.active{opacity:1;border-color:transparent;}
  .rsvp-btn.active.ok{background:var(--ok);color:#fff;}
  .rsvp-btn.active.pending{background:var(--accent);color:var(--dark);}
  .rsvp-btn.active.declined{background:var(--alert);color:#fff;}
  .friend-toggle{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--wood);
    background:var(--surface);flex-shrink:0;
  }
  .friend-toggle.on{background:var(--dark);border-color:var(--dark);color:var(--accent);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;}

  .game-pick-list{margin-top:10px;}
  .game-pick-item{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1.5px solid rgba(91,58,41,.15);
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .game-pick-item .gname{flex:1;font-weight:600;font-size:.9rem;}
  .game-pick-item button{
    background:none;color:var(--wood);font-size:1rem;padding:2px 6px;
  }

  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .emoji-pick button{
    width:38px;height:38px;font-size:1.2rem;
    border-radius:10px;border:2px solid rgba(91,58,41,.2);background:var(--surface);
  }
  .emoji-pick button.selected{border-color:var(--accent-dark);background:var(--accent);}

  .toast{
    position:fixed;
    bottom:90px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--dark);color:var(--bg);
    padding:10px 20px;border-radius:999px;
    font-size:.88rem;font-weight:600;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    z-index:200;
    pointer-events:none;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .share-box textarea{
    width:100%;min-height:160px;
    font-family:var(--font-mono);
    font-size:.85rem;
    padding:12px;
    border-radius:10px;
    border:1.5px solid rgba(91,58,41,.3);
    background:var(--surface);
    color:var(--text);
  }
</style>
</head>
<body>
<div id="app">
  <div id="banner-storage"></div>
  <header class="appbar">
    <h1>🎳 Kegelabend</h1>
    <p id="subtitle">Lade...</p>
  </header>

  <main>
    <section id="view-events" class="view active"></section>
    <section id="view-games" class="view"></section>
    <section id="view-friends" class="view"></section>
  </main>

  <button class="fab" id="fab" aria-label="Neu anlegen">+</button>

  <nav class="tabbar">
    <button data-tab="events" class="active"><span class="icon">🎳</span>Abende</button>
    <button data-tab="games"><span class="icon">📋</span>Spiele</button>
    <button data-tab="friends"><span class="icon">👥</span>Freunde</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Storage layer ---------- */
const K = { games:'kegel_games_v1', friends:'kegel_friends_v1', events:'kegel_events_v1' };
let memoryStore = {};
function testStorage(){
  try{ const t='__t__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
const storageAvailable = testStorage();

function loadData(key, fallback){
  try{
    if(storageAvailable){
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }
    return (key in memoryStore) ? memoryStore[key] : fallback;
  }catch(e){ return fallback; }
}
function saveData(key, value){
  try{
    if(storageAvailable){ localStorage.setItem(key, JSON.stringify(value)); }
    else { memoryStore[key] = value; }
  }catch(e){ /* ignore write errors */ }
}

if(!storageAvailable){
  const b = document.getElementById('banner-storage');
  b.style.display = 'block';
  b.textContent = '⚠️ In dieser Vorschau wird nicht dauerhaft gespeichert. Öffne die heruntergeladene Datei direkt in deinem Browser – dort funktioniert die Offline-Speicherung vollständig.';
}

/* ---------- Helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function esc(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDateHuman(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
}
function nameToColor(name){
  const palette = ['#1E3B2C','#5B3A29','#A23E33','#B8842E','#3F6B4A','#8a5a3b'];
  let h = 0;
  for(let i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
  return palette[Math.abs(h) % palette.length];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------- Seed data ---------- */
function seedGames(){
  return [
    { id:uid(), icon:'🍺', name:'Bierkegeln', beschreibung:'Klassiker: Wer die wenigsten Kegel trifft, gibt eine Runde aus.', minSpieler:2, maxSpieler:12, dauer:20 },
    { id:uid(), icon:'🏆', name:'König des Abends', beschreibung:'Turnier über mehrere Runden, am Ende gibt es einen Gesamtsieger.', minSpieler:4, maxSpieler:10, dauer:45 },
    { id:uid(), icon:'🎯', name:'Wurfrunden-Kegeln', beschreibung:'Jeder wirft reihum, Punkte werden pro Runde addiert.', minSpieler:2, maxSpieler:8, dauer:15 },
    { id:uid(), icon:'🙈', name:'Blindkegeln', beschreibung:'Mit verbundenen Augen werfen – sorgt garantiert für Lacher.', minSpieler:2, maxSpieler:8, dauer:15 }
  ];
}

/* ---------- State ---------- */
const state = {
  games: loadData(K.games, null),
  friends: loadData(K.friends, []),
  events: loadData(K.events, []),
  tab: 'events'
};
if(state.games === null){
  state.games = seedGames();
  saveData(K.games, state.games);
}

function persistGames(){ saveData(K.games, state.games); }
function persistFriends(){ saveData(K.friends, state.friends); }
function persistEvents(){ saveData(K.events, state.events); }

/* ---------- Emoji options ---------- */
const GAME_EMOJIS = ['🎳','🍺','🏆','🎯','🔥','🎲','⭐','🥨','🙈','🍀'];

/* =========================================================
   RENDER: EVENTS
   ========================================================= */
function eventDateTime(ev){
  return new Date((ev.datum||'2100-01-01') + 'T' + (ev.uhrzeit||'00:00'));
}
function renderEvents(){
  const el = document.getElementById('view-events');
  const now = new Date();
  const upcoming = state.events.filter(e => eventDateTime(e) >= now).sort((a,b)=> eventDateTime(a)-eventDateTime(b));
  const past = state.events.filter(e => eventDateTime(e) < now).sort((a,b)=> eventDateTime(b)-eventDateTime(a));

  const nextEv = upcoming[0];
  document.getElementById('subtitle').textContent = nextEv
    ? 'Nächster Abend: ' + formatDateHuman(nextEv.datum) + ' · ' + (nextEv.uhrzeit||'')
    : 'Noch nichts geplant';

  let html = '';
  if(state.events.length === 0){
    html += emptyState('🎳', 'Noch kein Kegelabend geplant.', 'Leg direkt los und plane den nächsten Abend mit deiner Truppe.');
  } else {
    html += '<h2 class="section-title">Kommende Abende</h2>';
    html += upcoming.length
      ? upcoming.map(ev => eventCard(ev,false)).join('')
      : '<p style="color:var(--text-muted);font-size:.9rem;">Aktuell nichts geplant – leg einen neuen Abend an.</p>';
    if(past.length){
      html += '<h2 class="section-title">Vergangene Abende</h2>';
      html += past.map(ev => eventCard(ev,true)).join('');
    }
  }
  html += '<div class="card dashed" id="add-event-card">+ Neuer Kegelabend</div>';
  el.innerHTML = html;

  $all('.event-card', el).forEach(c => c.addEventListener('click', () => openEventModal(c.dataset.id)));
  const addCard = document.getElementById('add-event-card');
  if(addCard) addCard.addEventListener('click', () => openEventModal(null));
}
function emptyState(emoji, title, sub){
  return '<div class="empty-state"><span class="emoji">'+emoji+'</span><p><strong>'+esc(title)+'</strong><br>'+esc(sub)+'</p></div>';
}
function eventCard(ev, isPast){
  const zugesagt = (ev.teilnehmer||[]).filter(t=>t.status==='zugesagt').length;
  const offen = (ev.teilnehmer||[]).filter(t=>t.status==='offen').length;
  const spieleCount = (ev.spiele||[]).length;
  const stamp = isPast ? '✔️' : '🎳';
  return '<div class="card event-card '+(isPast?'past':'')+'" data-id="'+ev.id+'" tabindex="0">'
    + '<div class="stamp">'+stamp+'</div>'
    + '<h3>'+esc(ev.titel || ('Kegelabend am ' + formatDateHuman(ev.datum)))+'</h3>'
    + '<div class="meta-row">📅 '+formatDateHuman(ev.datum)+' · '+esc(ev.uhrzeit||'--:--')+'</div>'
    + '<div class="meta-row">📍 '+esc(ev.ort || 'Ort offen')+'</div>'
    + '<div class="meta-row">👥 '+zugesagt+' zugesagt'+(offen?(' · '+offen+' offen'):'')+' &nbsp; 📋 '+spieleCount+' Spiele</div>'
    + '</div>';
}

/* =========================================================
   RENDER: GAMES
   ========================================================= */
function renderGames(){
  const el = document.getElementById('view-games');
  let html = '<h2 class="section-title">Spiele-Bestand</h2>';
  if(state.games.length === 0){
    html += emptyState('📋','Kein Spiel im Bestand.','Leg dein erstes Kegel-Spiel an.');
  } else {
    html += state.games.map(g => gameCard(g)).join('');
  }
  html += '<div class="card dashed" id="add-game-card">+ Neues Spiel</div>';
  el.innerHTML = html;

  $all('.game-card', el).forEach(c => c.addEventListener('click', () => openGameModal(c.dataset.id)));
  const addCard = document.getElementById('add-game-card');
  if(addCard) addCard.addEventListener('click', () => openGameModal(null));
}
function gameCard(g){
  return '<div class="card game-card" data-id="'+g.id+'" tabindex="0">'
    + '<div class="stamp">'+esc(g.icon||'🎳')+'</div>'
    + '<h3>'+esc(g.name)+'</h3>'
    + (g.beschreibung ? '<p style="margin:4px 0;font-size:.88rem;color:var(--text-muted);">'+esc(g.beschreibung)+'</p>' : '')
    + '<div class="meta-row">👥 '+g.minSpieler+'–'+g.maxSpieler+' Spieler · ⏱ ca. '+g.dauer+' Min.</div>'
    + '</div>';
}

/* =========================================================
   RENDER: FRIENDS
   ========================================================= */
function renderFriends(){
  const el = document.getElementById('view-friends');
  let html = '<h2 class="section-title">Freunde</h2>';
  if(state.friends.length === 0){
    html += emptyState('👥','Noch keine Kegelbrüder & -schwestern eingetragen.','Füg deine Truppe hinzu, dann geht die Einladung beim nächsten Abend blitzschnell.');
  } else {
    html += '<div class="card" style="cursor:default;">' + state.friends.map(f =>
      '<div class="friend-row" data-id="'+f.id+'" style="cursor:pointer;">'
      + '<div class="avatar" style="background:'+nameToColor(f.name)+';">'+esc(initials(f.name))+'</div>'
      + '<div class="fname">'+esc(f.name)+'</div>'
      + '<div style="color:var(--text-muted);font-size:1rem;">›</div>'
      + '</div>'
    ).join('') + '</div>';
  }
  html += '<div class="card dashed" id="add-friend-card">+ Freund hinzufügen</div>';
  el.innerHTML = html;

  $all('.friend-row', el).forEach(r => r.addEventListener('click', () => openFriendModal(r.dataset.id)));
  const addCard = document.getElementById('add-friend-card');
  if(addCard) addCard.addEventListener('click', () => openFriendModal(null));
}

/* =========================================================
   MODAL: base helpers
   ========================================================= */
const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modal-content');
function openModal(innerHtml){
  modalContent.innerHTML = '<div class="modal-inner-wrap"><button class="modal-close" id="modal-close-btn" aria-label="Schließen">✕</button>' + innerHtml + '</div>';
  overlay.classList.add('open');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
}
function closeModal(){
  overlay.classList.remove('open');
  modalContent.innerHTML = '';
}
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

/* =========================================================
   MODAL: Game form
   ========================================================= */
function openGameModal(id){
  const game = id ? state.games.find(g=>g.id===id) : null;
  const emojiRow = GAME_EMOJIS.map(e =>
    '<button type="button" class="emoji-opt '+(game && game.icon===e ? 'selected':'')+'" data-emoji="'+e+'">'+e+'</button>'
  ).join('');

  openModal(
    '<h2>'+(game?'Spiel bearbeiten':'Neues Spiel')+'</h2>'
    + '<div class="field"><label>Icon</label><div class="emoji-pick">'+emojiRow+'</div></div>'
    + '<div class="field"><label>Name</label><input type="text" id="g-name" value="'+(game?esc(game.name):'')+'" placeholder="z.B. Bierkegeln"></div>'
    + '<div class="field"><label>Beschreibung</label><textarea id="g-desc" placeholder="Kurze Regel-Erklärung...">'+(game?esc(game.beschreibung||''):'')+'</textarea></div>'
    + '<div class="two-col">'
      + '<div class="field"><label>Min. Spieler</label><input type="number" id="g-min" min="1" value="'+(game?game.minSpieler:2)+'"></div>'
      + '<div class="field"><label>Max. Spieler</label><input type="number" id="g-max" min="1" value="'+(game?game.maxSpieler:8)+'"></div>'
    + '</div>'
    + '<div class="field"><label>Dauer (Minuten)</label><input type="number" id="g-dauer" min="1" value="'+(game?game.dauer:20)+'"></div>'
    + '<div class="modal-actions">'
      + '<button class="btn btn-primary" id="g-save">Speichern</button>'
      + (game ? '<button class="btn btn-alert" id="g-delete">Löschen</button>' : '')
    + '</div>'
  );

  let selectedEmoji = game ? (game.icon || GAME_EMOJIS[0]) : GAME_EMOJIS[0];
  $all('.emoji-opt').forEach(btn => btn.addEventListener('click', () => {
    selectedEmoji = btn.dataset.emoji;
    $all('.emoji-opt').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  }));
  if(!game){ $all('.emoji-opt')[0].classList.add('selected'); }

  document.getElementById('g-save').addEventListener('click', () => {
    const name = document.getElementById('g-name').value.trim();
    if(!name){ showToast('Bitte einen Namen eintragen.'); return; }
    const data = {
      id: game ? game.id : uid(),
      icon: selectedEmoji,
      name,
      beschreibung: document.getElementById('g-desc').value.trim(),
      minSpieler: parseInt(document.getElementById('g-min').value,10) || 1,
      maxSpieler: parseInt(document.getElementById('g-max').value,10) || 1,
      dauer: parseInt(document.getElementById('g-dauer').value,10) || 10
    };
    if(game){
      const idx = state.games.findIndex(g=>g.id===game.id);
      state.games[idx] = data;
    } else {
      state.games.push(data);
    }
    persistGames();
    renderGames();
    closeModal();
    showToast('Spiel gespeichert 🎳');
  });

  const delBtn = document.getElementById('g-delete');
  if(delBtn) delBtn.addEventListener('click', () => {
    state.games = state.games.filter(g=>g.id!==game.id);
    persistGames();
    renderGames();
    closeModal();
    showToast('Spiel gelöscht');
  });
}

/* =========================================================
   MODAL: Friend form
   ========================================================= */
function openFriendModal(id){
  const friend = id ? state.friends.find(f=>f.id===id) : null;
  openModal(
    '<h2>'+(friend?'Freund bearbeiten':'Freund hinzufügen')+'</h2>'
    + '<div class="field"><label>Name</label><input type="text" id="f-name" value="'+(friend?esc(friend.name):'')+'" placeholder="Vorname"></div>'
    + '<div class="modal-actions">'
      + '<button class="btn btn-primary" id="f-save">Speichern</button>'
      + (friend ? '<button class="btn btn-alert" id="f-delete">Löschen</button>' : '')
    + '</div>'
  );
  document.getElementById('f-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    if(!name){ showToast('Bitte einen Namen eintragen.'); return; }
    if(friend){
      friend.name = name;
    } else {
      state.friends.push({ id:uid(), name });
    }
    persistFriends();
    renderFriends();
    closeModal();
    showToast('Gespeichert 👍');
  });
  const delBtn = document.getElementById('f-delete');
  if(delBtn) delBtn.addEventListener('click', () => {
    state.friends = state.friends.filter(f=>f.id!==friend.id);
    // auch aus allen Events entfernen
    state.events.forEach(ev => { ev.teilnehmer = (ev.teilnehmer||[]).filter(t=>t.friendId!==friend.id); });
    persistFriends();
    persistEvents();
    renderFriends();
    closeModal();
    showToast('Freund entfernt');
  });
}

/* =========================================================
   MODAL: Event form (Planung des Abends)
   ========================================================= */
function openEventModal(id){
  const ev = id ? state.events.find(e=>e.id===id) : null;
  // Arbeitskopie für Teilnehmer/Spiele-Auswahl
  const work = {
    teilnehmer: ev ? JSON.parse(JSON.stringify(ev.teilnehmer||[])) : [],
    spiele: ev ? [...(ev.spiele||[])] : []
  };

  function friendStatus(friendId){
    const t = work.teilnehmer.find(t=>t.friendId===friendId);
    return t ? t.status : null;
  }
  function toggleFriend(friendId){
    const idx = work.teilnehmer.findIndex(t=>t.friendId===friendId);
    if(idx>=0){ work.teilnehmer.splice(idx,1); }
    else { work.teilnehmer.push({friendId, status:'offen'}); }
  }
  function setStatus(friendId, status){
    const t = work.teilnehmer.find(t=>t.friendId===friendId);
    if(t) t.status = status;
  }
  function toggleGame(gameId){
    const idx = work.spiele.indexOf(gameId);
    if(idx>=0) work.spiele.splice(idx,1);
    else work.spiele.push(gameId);
  }
  function moveGame(gameId, dir){
    const idx = work.spiele.indexOf(gameId);
    const newIdx = idx+dir;
    if(newIdx<0 || newIdx>=work.spiele.length) return;
    [work.spiele[idx], work.spiele[newIdx]] = [work.spiele[newIdx], work.spiele[idx]];
  }

  function friendsBlockHtml(){
    if(state.friends.length===0){
      return '<p style="font-size:.85rem;color:var(--text-muted);">Noch keine Freunde eingetragen. Wechsle kurz zum Tab "Freunde" und leg sie an.</p>';
    }
    return state.friends.map(f => {
      const st = friendStatus(f.id);
      const on = st !== null;
      return '<div class="friend-row">'
        + '<button type="button" class="friend-toggle '+(on?'on':'')+'" data-friend="'+f.id+'" data-action="toggle">'+(on?'✓':'')+'</button>'
        + '<div class="avatar" style="background:'+nameToColor(f.name)+';width:28px;height:28px;font-size:.7rem;">'+esc(initials(f.name))+'</div>'
        + '<div class="fname">'+esc(f.name)+'</div>'
        + '<div class="rsvp-group">'
          + '<button type="button" class="rsvp-btn '+(st==='zugesagt'?'active ok':'')+'" data-friend="'+f.id+'" data-status="zugesagt" title="Zugesagt">✅</button>'
          + '<button type="button" class="rsvp-btn '+(st==='offen'?'active pending':'')+'" data-friend="'+f.id+'" data-status="offen" title="Offen">❓</button>'
          + '<button type="button" class="rsvp-btn '+(st==='abgesagt'?'active declined':'')+'" data-friend="'+f.id+'" data-status="abgesagt" title="Abgesagt">❌</button>'
        + '</div>'
      + '</div>';
    }).join('');
  }

  function gamesChipsHtml(){
    if(state.games.length===0) return '<p style="font-size:.85rem;color:var(--text-muted);">Kein Spiel im Bestand – leg zuerst eins im Tab "Spiele" an.</p>';
    return '<div class="chip-row">' + state.games.map(g =>
      '<button type="button" class="chip '+(work.spiele.includes(g.id)?'selected':'')+'" data-game="'+g.id+'">'+esc(g.icon)+' '+esc(g.name)+'</button>'
    ).join('') + '</div>';
  }
  function gamesOrderHtml(){
    if(work.spiele.length===0) return '<p style="font-size:.85rem;color:var(--text-muted);">Noch keine Spiele ausgewählt.</p>';
    return '<div class="game-pick-list">' + work.spiele.map((gid,i) => {
      const g = state.games.find(x=>x.id===gid);
      if(!g) return '';
      return '<div class="game-pick-item">'
        + '<span class="gname">'+(i+1)+'. '+esc(g.icon)+' '+esc(g.name)+'</span>'
        + '<button type="button" data-order-up="'+gid+'" '+(i===0?'disabled':'')+'>▲</button>'
        + '<button type="button" data-order-down="'+gid+'" '+(i===work.spiele.length-1?'disabled':'')+'>▼</button>'
        + '<button type="button" data-remove-game="'+gid+'">✕</button>'
      + '</div>';
    }).join('') + '</div>';
  }

  function bodyHtml(){
    return '<h2>'+(ev?'Kegelabend bearbeiten':'Neuer Kegelabend')+'</h2>'
      + '<div class="field"><label>Titel (optional)</label><input type="text" id="e-titel" value="'+(ev?esc(ev.titel||''):'')+'" placeholder="z.B. Sommer-Kegeln"></div>'
      + '<div class="two-col">'
        + '<div class="field"><label>Datum</label><input type="date" id="e-datum" value="'+(ev?ev.datum:'')+'"></div>'
        + '<div class="field"><label>Uhrzeit</label><input type="time" id="e-uhrzeit" value="'+(ev?ev.uhrzeit:'20:00')+'"></div>'
      + '</div>'
      + '<div class="field"><label>Ort</label><input type="text" id="e-ort" value="'+(ev?esc(ev.ort||''):'')+'" placeholder="z.B. Kegelbahn Krönchen"></div>'
      + '<div class="field"><label>Notizen</label><textarea id="e-notizen" placeholder="z.B. Wer bringt was mit?">'+(ev?esc(ev.notizen||''):'')+'</textarea></div>'
      + '<h2 class="section-title" style="margin-top:22px;">Teilnehmer</h2>'
      + '<div id="friends-block">'+friendsBlockHtml()+'</div>'
      + '<h2 class="section-title" style="margin-top:22px;">Spiele für den Abend</h2>'
      + '<div id="games-chips">'+gamesChipsHtml()+'</div>'
      + '<div id="games-order">'+gamesOrderHtml()+'</div>'
      + '<div class="modal-actions">'
        + '<button class="btn btn-primary" id="e-save">Speichern</button>'
        + (ev ? '<button class="btn btn-outline" id="e-share">Teilen</button>' : '')
        + (ev ? '<button class="btn btn-alert" id="e-delete">Löschen</button>' : '')
      + '</div>';
  }

  function attachHandlers(){
    $all('[data-action="toggle"]').forEach(btn => btn.addEventListener('click', () => {
      toggleFriend(btn.dataset.friend);
      refreshFriendsBlock();
    }));
    $all('.rsvp-btn').forEach(btn => btn.addEventListener('click', () => {
      const fid = btn.dataset.friend;
      if(friendStatus(fid)===null) toggleFriend(fid);
      setStatus(fid, btn.dataset.status);
      refreshFriendsBlock();
    }));
    $all('.chip[data-game]').forEach(chip => chip.addEventListener('click', () => {
      toggleGame(chip.dataset.game);
      refreshGamesBlocks();
    }));
    $all('[data-order-up]').forEach(b => b.addEventListener('click', () => { moveGame(b.dataset.orderUp,-1); refreshGamesBlocks(); }));
    $all('[data-order-down]').forEach(b => b.addEventListener('click', () => { moveGame(b.dataset.orderDown,1); refreshGamesBlocks(); }));
    $all('[data-remove-game]').forEach(b => b.addEventListener('click', () => {
      work.spiele = work.spiele.filter(id=>id!==b.dataset.removeGame);
      refreshGamesBlocks();
    }));

    document.getElementById('e-save').addEventListener('click', saveEvent);
    const shareBtn = document.getElementById('e-share');
    if(shareBtn) shareBtn.addEventListener('click', () => shareEvent(ev, work));
    const delBtn = document.getElementById('e-delete');
    if(delBtn) delBtn.addEventListener('click', () => {
      state.events = state.events.filter(e=>e.id!==ev.id);
      persistEvents();
      renderEvents();
      closeModal();
      showToast('Kegelabend gelöscht');
    });
  }
  function refreshFriendsBlock(){
    document.getElementById('friends-block').innerHTML = friendsBlockHtml();
    attachHandlers();
  }
  function refreshGamesBlocks(){
    document.getElementById('games-chips').innerHTML = gamesChipsHtml();
    document.getElementById('games-order').innerHTML = gamesOrderHtml();
    attachHandlers();
  }
  function saveEvent(){
    const datum = document.getElementById('e-datum').value;
    if(!datum){ showToast('Bitte ein Datum wählen.'); return; }
    const data = {
      id: ev ? ev.id : uid(),
      titel: document.getElementById('e-titel').value.trim(),
      datum,
      uhrzeit: document.getElementById('e-uhrzeit').value || '20:00',
      ort: document.getElementById('e-ort').value.trim(),
      notizen: document.getElementById('e-notizen').value.trim(),
      teilnehmer: work.teilnehmer,
      spiele: work.spiele
    };
    if(ev){
      const idx = state.events.findIndex(e=>e.id===ev.id);
      state.events[idx] = data;
    } else {
      state.events.push(data);
    }
    persistEvents();
    renderEvents();
    closeModal();
    showToast('Kegelabend gespeichert 🎳');
  }

  openModal(bodyHtml());
  attachHandlers();
}

/* ---------- Share / Einladungstext ---------- */
function shareEvent(ev, work){
  const teilnehmerLines = work.teilnehmer.map(t => {
    const f = state.friends.find(fr=>fr.id===t.friendId);
    if(!f) return null;
    const icon = t.status==='zugesagt' ? '✅' : t.status==='abgesagt' ? '❌' : '❓';
    return icon + ' ' + f.name;
  }).filter(Boolean).join('\n');
  const spieleLines = work.spiele.map((gid,i) => {
    const g = state.games.find(x=>x.id===gid);
    return g ? (i+1)+'. '+g.icon+' '+g.name : null;
  }).filter(Boolean).join('\n');

  const titel = document.getElementById('e-titel') ? document.getElementById('e-titel').value.trim() : (ev.titel||'');
  const datum = document.getElementById('e-datum') ? document.getElementById('e-datum').value : ev.datum;
  const uhrzeit = document.getElementById('e-uhrzeit') ? document.getElementById('e-uhrzeit').value : ev.uhrzeit;
  const ort = document.getElementById('e-ort') ? document.getElementById('e-ort').value.trim() : ev.ort;

  let text = '🎳 ' + (titel || 'KEGELABEND') + ' 🎳\n';
  text += '📅 ' + formatDateHuman(datum) + ' um ' + (uhrzeit||'') + ' Uhr\n';
  if(ort) text += '📍 ' + ort + '\n';
  text += '\n';
  if(teilnehmerLines){ text += 'Teilnehmer:\n' + teilnehmerLines + '\n\n'; }
  if(spieleLines){ text += 'Spiele heute:\n' + spieleLines + '\n\n'; }
  text += 'Bis dann! 🍻';

  openModal(
    '<h2>Einladung teilen</h2>'
    + '<div class="field share-box"><textarea id="share-text" readonly>'+esc(text)+'</textarea></div>'
    + '<div class="modal-actions">'
      + '<button class="btn btn-primary" id="share-native">Teilen</button>'
      + '<button class="btn btn-outline" id="share-copy">Kopieren</button>'
    + '</div>'
  );
  document.getElementById('share-native').addEventListener('click', async () => {
    if(navigator.share){
      try{ await navigator.share({ text, title:'Kegelabend' }); }catch(e){ /* abgebrochen */ }
    } else {
      copyToClipboard(text);
    }
  });
  document.getElementById('share-copy').addEventListener('click', () => copyToClipboard(text));
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('In Zwischenablage kopiert 📋')).catch(()=> fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.getElementById('share-text');
  if(ta){ ta.select(); try{ document.execCommand('copy'); showToast('In Zwischenablage kopiert 📋'); }catch(e){ showToast('Kopieren nicht möglich – Text manuell markieren.'); } }
}

/* ---------- Tabs & FAB ---------- */
function setTab(tab){
  state.tab = tab;
  $all('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  $all('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderAll();
}
$all('nav.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

document.getElementById('fab').addEventListener('click', () => {
  if(state.tab==='events') openEventModal(null);
  else if(state.tab==='games') openGameModal(null);
  else openFriendModal(null);
});

function renderAll(){
  renderEvents();
  renderGames();
  renderFriends();
}
renderAll();

/* ---------- Service Worker (nur wenn gehostet, nicht bei file://) ---------- */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

})();
